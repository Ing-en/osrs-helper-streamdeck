<!doctype html>
<html>
	<head lang="en">
		<title>Idle Alert Settings</title>
		<meta charset="utf-8" />
		<script src="sdpi-components.js"></script>
	</head>

	<body>
		<sdpi-item label="Account">
			<sdpi-select setting="account" datasource="getAccounts" hot-reload default="any" loading="Loading..."></sdpi-select>
		</sdpi-item>
		<sdpi-item label="When idle">
			<sdpi-checkbox setting="flash" default="true" label="Flash"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Flash speed">
			<sdpi-select setting="speed" default="normal">
				<option value="slow">Slow</option>
				<option value="normal">Normal</option>
				<option value="fast">Fast</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="On press">
			<sdpi-checkbox setting="focusOnPress" default="true" label="Bring RuneLite to the front"></sdpi-checkbox>
		</sdpi-item>
		<p style="color: #969696; font-size: 9pt; margin: 8px 16px">
			In RuneLite, turn on Idle Notifier and set its notifications' <b>Request focus</b> to <b>Taskbar</b>: the key flashes
			when RuneLite does. Pressing a key or moving the mouse in RuneLite clears it, and so does pressing this key.
		</p>
	</body>
</html>
